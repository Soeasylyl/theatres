services:
    php-fpm:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: php:8.1.4-fpm
        container_name: php-fpm-mult
        ports:
            - "80:80"
        volumes:
            - ./app/:/var/www/html
            - './nginx/default.conf:/etc/nginx/conf.d/default.conf'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis

    pgsql:
        image: 'postgres:15.4'
        container_name: postgres-multivendor
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'pgsql-data:/var/lib/pgsql/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - -d
                - ${DB_DATABASE}
                - -U
                - ${DB_USERNAME}
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        container_name: redis-multivendor
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    pgsql-data:
        driver: local


